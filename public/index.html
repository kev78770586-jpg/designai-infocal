<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesignAI - INFOCAL Santa Cruz</title>
  <script>
    // Comprobación rápida y redirección automática
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => {
        if (data.autenticado) {
          window.location.replace('/dashboard.html');
        } else {
          window.location.replace('/login.html');
        }
      })
      .catch(() => {
        window.location.replace('/login.html');
      });
  </script>
</head>
<body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #F8FAFC; color: #002D62;">
  <div style="text-align: center;">
    <h2 style="margin: 0; font-size: 24px;">DesignAI</h2>
    <p style="margin: 8px 0 0; color: #2563EB; font-size: 14px;">INFOCAL Santa Cruz — Cargando plataforma...</p>
  </div>
</body>
</html>
